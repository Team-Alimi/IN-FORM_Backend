version: "3.8"

services:
  database:
    container_name: inform-db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: informserver
      MYSQL_ROOT_PASSWORD: 1234
      TZ: 'Asia/Seoul'
    ports:
      - "13306:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    networks:
      - inform-network
    volumes:
      - inform_mysql_data:/var/lib/mysql

  application:
    container_name: inform-api
    restart: always
    build:
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/informserver?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      - database
    networks:
      - inform-network

  nginx:
    image: nginx:stable-alpine
    container_name: inform-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - application
    networks:
      - inform-network

networks:
  inform-network:
    driver: bridge

volumes:
  inform_mysql_data: